# .gitlab-ci.yml — Test pipeline for the StatCan Tables & Charts Validator.
# Deterministic-only: the whole pipeline is pure Python, no services needed.
# Runs on every push and merge request. Override the image in the repo's
# CI/CD settings if your GitLab runner standardizes on a different Python.
stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

cache:
  key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

.test-template:
  stage: test
  before_script:
    - python3 -m venv .venv
    - .venv/bin/python -m pip install --quiet --upgrade pip
    - .venv/bin/python -m pip install --quiet -r requirements.txt
  script:
    - bash scripts/verify_deployment.sh
  artifacts:
    when: always
    paths:
      - /tmp/tvc_pytest.txt
    expire_in: 1 week

test:python311:
  extends: .test-template
  image: python:3.11-slim

test:python312:
  extends: .test-template
  image: python:3.12-slim
  allow_failure: false
